name: Restore BYOK custom endpoint

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Custom Endpoint
        run: python .github/restore-custom-endpoint.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm typecheck
          pnpm lint
          rm -rf dist-byok dist-gateway
          pnpm build:byok
          pnpm build:gateway

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/taskpane/components/chat/config.ts \
                  src/taskpane/components/chat/model-discovery.ts \
                  src/taskpane/components/chat/settings-panel.tsx \
                  scripts/local-cors-bridge.js
          git commit -m 'Restore BYOK custom endpoint support'
          git push
