name: Apply timeout fix
on: push

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-models-gateway-mode
          fetch-depth: 0
      - name: Apply targeted fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/taskpane/components/chat/settings-panel.tsx')
          s = p.read_text()
          old = "                cancelDiscovery();\n                if (isCustom) clearProviderConfig();\n                setResponseStartTimeoutSeconds(Math.min(3600, next));"
          new = "                cancelDiscovery();\n                setResponseStartTimeoutSeconds(Math.min(3600, next));"
          if old not in s:
              raise SystemExit('timeout handler pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/test-review-regressions.js')
          s = p.read_text()
          anchor = 'assert.equal(clearProvider.includes("isStreamingRef.current = false"), false, "Invalidating config must not fake Agent idle");\n'
          guard = '''assert.equal(
            settings.includes(
              'cancelDiscovery();\\n                if (isCustom) clearProviderConfig();\\n                setResponseStartTimeoutSeconds',
            ),
            false,
            "Editing Custom Endpoint response-start timeout must not abort the active request",
          );
'''
          if anchor not in s:
              raise SystemExit('regression anchor not found')
          p.write_text(s.replace(anchor, anchor + guard, 1))
          PY
      - name: Verify regression guard
        run: node scripts/test-review-regressions.js
      - name: Commit targeted fix and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-timeout-fix.yml .github/workflows/apply-timeout-draft-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Custom Endpoint timeout draft abort"
          git push origin HEAD:feature/live-models-gateway-mode
