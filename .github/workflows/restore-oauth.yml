name: Restore BYOK OAuth support

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  restore-oauth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Restore OAuth credential guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/taskpane/components/chat/settings-panel.tsx')
          text = path.read_text()

          marker = '''const THINKING_LEVELS: { value: ThinkingLevel; label: string }[] = [
            { value: "none", label: "None" },
            { value: "low", label: "Low" },
            { value: "medium", label: "Medium" },
            { value: "high", label: "High" },
          ];
          '''
          replacement = marker + '''
          const OAUTH_ONLY_PROVIDERS = new Set([
            "openai-codex",
            "github-copilot",
            "google-gemini-cli",
            "google-antigravity",
          ]);

          function getCredentialCopy(provider: string): { label: string; placeholder: string } {
            if (provider === "anthropic") {
              return {
                label: "API Key / Claude OAuth Token",
                placeholder: "sk-ant-... or sk-ant-oat...",
              };
            }
            if (OAUTH_ONLY_PROVIDERS.has(provider)) {
              return {
                label: "OAuth Token",
                placeholder: "Paste the OAuth credential for this provider",
              };
            }
            return { label: "API Key / Token", placeholder: "Enter your credential" };
          }
          '''
          if marker not in text:
            raise SystemExit('thinking-level marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '''  const connectLabel = models.length > 0 || discoverySource ? "Refresh Models" : "Connect";
          '''
          replacement = marker + '''  const credentialCopy = getCredentialCopy(provider);
          '''
          if marker not in text:
            raise SystemExit('connectLabel marker not found')
          text = text.replace(marker, replacement, 1)

          old = '<span className="block text-xs text-(--chat-text-secondary) mb-1.5">API Key / Token</span>'
          new = '<span className="block text-xs text-(--chat-text-secondary) mb-1.5">{credentialCopy.label}</span>'
          if old not in text:
            raise SystemExit('credential label marker not found')
          text = text.replace(old, new, 1)

          if 'placeholder="Enter your credential"' not in text:
            raise SystemExit('credential placeholder marker not found')
          text = text.replace('placeholder="Enter your credential"', 'placeholder={credentialCopy.placeholder}', 1)

          if 'Required for Anthropic and some providers' not in text:
            raise SystemExit('proxy helper marker not found')
          text = text.replace(
              'Required for Anthropic and some providers',
              'Required for Claude OAuth and some providers',
              1,
          )

          old = 'CORS Proxy: Requests route through your proxy to bypass browser CORS restrictions.'
          new = 'CORS Proxy: Requests route through your proxy to bypass browser CORS restrictions. Required for Claude OAuth and Z.ai.'
          if old not in text:
            raise SystemExit('about proxy marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          readme = Path('README.md')
          r = readme.read_text()
          old = '2. **API Key / Token** - Use the provider credential supported by the existing integration.'
          new = '2. **Credential** - Use the provider credential supported by the existing integration. Existing OAuth credential paths remain supported; for example, Anthropic accepts Claude OAuth tokens as well as API keys.'
          if old in r:
            r = r.replace(old, new, 1)
          readme.write_text(r)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome check --write --unsafe src/

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build BYOK mode
        run: pnpm build:byok

      - name: Build Gateway mode
        run: pnpm build:gateway

      - name: Commit OAuth restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/taskpane/components/chat/settings-panel.tsx README.md
          git commit -m "Restore BYOK OAuth credential support guidance"
          git push origin HEAD:feature/live-models-gateway-mode
