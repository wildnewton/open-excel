name: Patch response start timeout

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply timeout patch
        run: python .github/patch-response-start-timeout.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format patch
        run: pnpm lint:fix

      - name: Validate
        run: |
          pnpm test:bridge
          pnpm typecheck
          pnpm lint
          pnpm build:byok
          pnpm build:gateway

      - name: Verify timeout wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path('src/taskpane/components/chat/config.ts').read_text()
          settings = Path('src/taskpane/components/chat/settings-panel.tsx').read_text()
          chat = Path('src/taskpane/components/chat/chat-context.tsx').read_text()
          bridge = Path('scripts/local-cors-bridge.js').read_text()
          assert 'DEFAULT_RESPONSE_START_TIMEOUT_SECONDS = 180' in Path('src/lib/request-timeout.ts').read_text()
          assert config.count('responseStartTimeoutSeconds: number;') == 2
          assert settings.count('Response Start Timeout (seconds)') == 2
          assert 'createResponseStartTimeoutFetch(cfg.responseStartTimeoutSeconds)' in chat
          assert 'DEFAULT_UPSTREAM_HEADER_TIMEOUT_MS = 180000' in bridge
          assert 'parseUpstreamHeaderTimeoutMs' in bridge
          print('Timeout wiring checks passed')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/request-timeout.ts src/lib/cors-proxy.ts src/taskpane/components/chat/config.ts src/taskpane/components/chat/chat-context.tsx src/taskpane/components/chat/model-discovery.ts src/taskpane/components/chat/settings-panel.tsx scripts/local-cors-bridge.js scripts/test-local-cors-bridge.js
          git commit -m 'Make response start timeout configurable'
          git push
