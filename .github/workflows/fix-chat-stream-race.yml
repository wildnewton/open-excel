name: Fix chat stream race

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply race fix
        run: python .github/fix-chat-stream-race.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm build:byok
          pnpm build:gateway

      - name: Verify captured stream id
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/taskpane/components/chat/chat-context.tsx').read_text()
          assert 'const messageId = streamingMessageIdRef.current;' in text
          assert 'messages.findIndex((m) => m.id === messageId)' in text
          print('Captured stream id checks passed')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/taskpane/components/chat/chat-context.tsx
          git commit -m 'Fix batched chat stream updates'
          git push
