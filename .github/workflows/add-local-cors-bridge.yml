name: Add local CORS bridge

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Implement local CORS bridge
        run: |
          mkdir -p scripts
          cat > scripts/local-cors-bridge.js <<'EOF'
          const https = require("https");
          const net = require("net");
          const { execFileSync } = require("child_process");
          const { HttpsProxyAgent } = require("https-proxy-agent");

          const BRIDGE_PATH = "/__openexcel_bridge";
          const HOP_BY_HOP_HEADERS = new Set([
            "connection",
            "keep-alive",
            "proxy-authenticate",
            "proxy-authorization",
            "te",
            "trailer",
            "transfer-encoding",
            "upgrade",
          ]);
          const REQUEST_HEADERS_TO_DROP = new Set([
            ...HOP_BY_HOP_HEADERS,
            "host",
            "origin",
            "referer",
            "cookie",
            "sec-fetch-dest",
            "sec-fetch-mode",
            "sec-fetch-site",
          ]);
          const RESPONSE_HEADERS_TO_DROP = new Set([...HOP_BY_HOP_HEADERS, "set-cookie"]);

          function isPrivateIpv4(hostname) {
            const parts = hostname.split(".").map(Number);
            if (parts.length !== 4 || parts.some((part) => !Number.isInteger(part) || part < 0 || part > 255)) {
              return false;
            }
            const [a, b] = parts;
            return (
              a === 0 ||
              a === 10 ||
              a === 127 ||
              (a === 169 && b === 254) ||
              (a === 172 && b >= 16 && b <= 31) ||
              (a === 192 && b === 168)
            );
          }

          function isDisallowedTarget(target) {
            const hostname = target.hostname.toLowerCase().replace(/^\[|\]$/g, "");
            if (target.protocol !== "https:") return true;
            if (hostname === "localhost" || hostname.endsWith(".local")) return true;
            if (net.isIPv4(hostname)) return isPrivateIpv4(hostname);
            if (net.isIPv6(hostname)) {
              return hostname === "::1" || hostname.startsWith("fc") || hostname.startsWith("fd") || hostname.startsWith("fe8") || hostname.startsWith("fe9") || hostname.startsWith("fea") || hostname.startsWith("feb");
            }
            return false;
          }

          function parseMacSystemProxy() {
            if (process.platform !== "darwin") return null;
            try {
              const output = execFileSync("/usr/sbin/scutil", ["--proxy"], { encoding: "utf8" });
              const value = (key) => {
                const match = output.match(new RegExp(`^\\s*${key}\\s*:\\s*(.+?)\\s*$`, "m"));
                return match?.[1]?.trim() || null;
              };

              const httpsEnabled = value("HTTPSEnable") === "1";
              const httpsHost = value("HTTPSProxy");
              const httpsPort = value("HTTPSPort");
              if (httpsEnabled && httpsHost && httpsPort) return `http://${httpsHost}:${httpsPort}`;

              const httpEnabled = value("HTTPEnable") === "1";
              const httpHost = value("HTTPProxy");
              const httpPort = value("HTTPPort");
              if (httpEnabled && httpHost && httpPort) return `http://${httpHost}:${httpPort}`;
            } catch {
              // System proxy discovery is best-effort. Direct networking remains available.
            }
            return null;
          }

          function detectOutboundProxy() {
            const explicit = process.env.OPENEXCEL_UPSTREAM_PROXY?.trim();
            if (explicit) return { url: explicit, source: "OPENEXCEL_UPSTREAM_PROXY" };

            const system = parseMacSystemProxy();
            if (system) return { url: system, source: "macOS system proxy" };

            const envProxy = (process.env.HTTPS_PROXY || process.env.https_proxy || process.env.HTTP_PROXY || process.env.http_proxy || "").trim();
            if (envProxy) return { url: envProxy, source: "proxy environment" };
            return null;
          }

          function copyRequestHeaders(headers) {
            const result = {};
            for (const [name, value] of Object.entries(headers)) {
              if (value === undefined || REQUEST_HEADERS_TO_DROP.has(name.toLowerCase())) continue;
              result[name] = value;
            }
            return result;
          }

          function copyResponseHeaders(upstream, response) {
            for (const [name, value] of Object.entries(upstream.headers)) {
              if (value === undefined || RESPONSE_HEADERS_TO_DROP.has(name.toLowerCase())) continue;
              response.setHeader(name, value);
            }
            response.setHeader("Cache-Control", "no-store");
            response.setHeader("X-OpenExcel-Bridge", "local-dev");
          }

          function createLocalCorsBridgeMiddleware() {
            const outboundProxy = detectOutboundProxy();
            let agent;
            if (outboundProxy) {
              try {
                agent = new HttpsProxyAgent(outboundProxy.url);
                console.log(`[OpenExcel bridge] Outbound traffic will use ${outboundProxy.source}: ${outboundProxy.url.replace(/:\/\/[^@]+@/, "://***@")}`);
              } catch (error) {
                console.warn(`[OpenExcel bridge] Ignoring invalid outbound proxy: ${error instanceof Error ? error.message : String(error)}`);
              }
            } else {
              console.log("[OpenExcel bridge] No outbound proxy detected; using direct network access.");
            }

            return (request, response, next) => {
              let requestUrl;
              try {
                requestUrl = new URL(request.url, "https://localhost");
              } catch {
                return next();
              }

              if (requestUrl.pathname !== BRIDGE_PATH) return next();

              const rawTarget = requestUrl.searchParams.get("url");
              if (!rawTarget) {
                response.statusCode = 400;
                response.end("Missing url query parameter");
                return;
              }

              let target;
              try {
                target = new URL(rawTarget);
              } catch {
                response.statusCode = 400;
                response.end("Invalid target URL");
                return;
              }

              if (isDisallowedTarget(target)) {
                response.statusCode = 403;
                response.end("Local CORS bridge only allows public HTTPS targets");
                return;
              }

              const method = (request.method || "GET").toUpperCase();
              if (!["GET", "POST", "HEAD"].includes(method)) {
                response.statusCode = 405;
                response.end("Method not allowed");
                return;
              }

              const upstreamRequest = https.request(
                target,
                {
                  method,
                  headers: copyRequestHeaders(request.headers),
                  agent,
                },
                (upstreamResponse) => {
                  response.statusCode = upstreamResponse.statusCode || 502;
                  if (upstreamResponse.statusMessage) response.statusMessage = upstreamResponse.statusMessage;
                  copyResponseHeaders(upstreamResponse, response);
                  upstreamResponse.pipe(response);
                },
              );

              upstreamRequest.on("error", (error) => {
                if (!response.headersSent) {
                  response.statusCode = 502;
                  response.setHeader("Content-Type", "text/plain; charset=utf-8");
                }
                response.end(`OpenExcel local bridge failed: ${error instanceof Error ? error.message : String(error)}`);
              });

              request.pipe(upstreamRequest);
            };
          }

          module.exports = { BRIDGE_PATH, createLocalCorsBridgeMiddleware };
          EOF

          mkdir -p src/lib
          cat > src/lib/cors-proxy.ts <<'EOF'
          export interface CorsProxyOptions {
            useProxy: boolean;
            proxyUrl: string;
          }

          export const LOCAL_CORS_BRIDGE_PATH = "/__openexcel_bridge";

          function trimTrailingSlash(value: string): string {
            return value.replace(/\/+$/, "");
          }

          function isLocalDevelopmentHost(): boolean {
            if (typeof window === "undefined") return false;
            return window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
          }

          export function buildCorsProxyUrl(targetUrl: string, options: CorsProxyOptions): string {
            if (!options.useProxy) return targetUrl;

            const customProxy = options.proxyUrl.trim();
            if (customProxy) {
              return `${trimTrailingSlash(customProxy)}/?url=${encodeURIComponent(targetUrl)}`;
            }

            if (isLocalDevelopmentHost()) {
              return `${window.location.origin}${LOCAL_CORS_BRIDGE_PATH}?url=${encodeURIComponent(targetUrl)}`;
            }

            return targetUrl;
          }

          export function isUsingBuiltInLocalBridge(options: CorsProxyOptions): boolean {
            return options.useProxy && !options.proxyUrl.trim() && isLocalDevelopmentHost();
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          # model-discovery: use one shared proxy/bridge URL builder.
          path = Path("src/taskpane/components/chat/model-discovery.ts")
          text = path.read_text()
          marker = 'import { getModel, getModels, type Model } from "@earendil-works/pi-ai/compat";\n'
          if marker not in text:
              raise SystemExit("model-discovery import marker not found")
          text = text.replace(marker, marker + 'import { buildCorsProxyUrl } from "../../../lib/cors-proxy";\n', 1)
          old = '''function applyCorsProxy(url: string, config: ByokProviderConfig): string {\n  if (!config.useProxy || !config.proxyUrl.trim()) return url;\n  return `${trimTrailingSlash(config.proxyUrl.trim())}/?url=${encodeURIComponent(url)}`;\n}\n\n'''
          if old not in text:
              raise SystemExit("model-discovery applyCorsProxy marker not found")
          text = text.replace(old, "", 1)
          text = text.replace("applyCorsProxy(", "buildCorsProxyUrl(")
          path.write_text(text)

          # OAuth exchange/refresh: same local bridge behavior, auth flow otherwise untouched.
          path = Path("src/lib/oauth/index.ts")
          text = path.read_text()
          if not text.startswith("export interface OAuthCredentials"):
              raise SystemExit("oauth file start marker not found")
          text = 'import { buildCorsProxyUrl } from "../cors-proxy";\n\n' + text
          old = '''function buildProxiedUrl(baseUrl: string, useProxy: boolean, proxyUrl: string): string {\n  return useProxy && proxyUrl ? `${proxyUrl}/?url=${encodeURIComponent(baseUrl)}` : baseUrl;\n}\n'''
          new = '''function buildProxiedUrl(baseUrl: string, useProxy: boolean, proxyUrl: string): string {\n  return buildCorsProxyUrl(baseUrl, { useProxy, proxyUrl });\n}\n'''
          if old not in text:
              raise SystemExit("oauth proxy helper marker not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Runtime streaming: proxy the model base URL through the same bridge.
          path = Path("src/taskpane/components/chat/chat-context.tsx")
          text = path.read_text()
          marker = 'import type { DirtyRange } from "../../../lib/dirty-tracker";\n'
          if marker not in text:
              raise SystemExit("chat-context import marker not found")
          text = text.replace(marker, 'import { buildCorsProxyUrl } from "../../../lib/cors-proxy";\n' + marker, 1)
          old = '''function applyProxyToModel(model: Model<any>, config: ProviderConfig): Model<any> {\n  if (config.mode !== "byok" || !config.useProxy || !config.proxyUrl || !model.baseUrl) return model;\n  return {\n    ...model,\n    baseUrl: `${config.proxyUrl}/?url=${encodeURIComponent(model.baseUrl)}`,\n  };\n}\n'''
          new = '''function applyProxyToModel(model: Model<any>, config: ProviderConfig): Model<any> {\n  if (config.mode !== "byok" || !model.baseUrl) return model;\n  return {\n    ...model,\n    baseUrl: buildCorsProxyUrl(model.baseUrl, config),\n  };\n}\n'''
          if old not in text:
              raise SystemExit("chat-context applyProxyToModel marker not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Clarify that the textbox is for a CORS reverse proxy, not Clash/Surge's forward proxy.
          path = Path("src/taskpane/components/chat/settings-panel.tsx")
          text = path.read_text()
          text = text.replace(
              'Required for Anthropic and some providers',
              'Leave custom URL blank on localhost to use the built-in bridge',
              1,
          )
          text = text.replace('placeholder="https://your-proxy.com/proxy"', 'placeholder="Optional custom CORS proxy URL"', 1)
          text = text.replace(
              'Your proxy should accept ?url=encoded_url format',
              'Not a system/Clash proxy. Leave blank for the local development bridge.',
              1,
          )
          path.write_text(text)

          # Wire the bridge into webpack-dev-server only. Production bundles are unchanged.
          path = Path("webpack.config.js")
          text = path.read_text()
          marker = 'const path = require("path");\n'
          if marker not in text:
              raise SystemExit("webpack require marker not found")
          text = text.replace(
              marker,
              marker + 'const { createLocalCorsBridgeMiddleware } = require("./scripts/local-cors-bridge");\n',
              1,
          )
          marker = '''    devServer: {\n      hot: true,\n'''
          replacement = '''    devServer: {\n      hot: true,\n      host: "localhost",\n      setupMiddlewares(middlewares, devServer) {\n        middlewares.unshift({\n          name: "openexcel-local-cors-bridge",\n          middleware: createLocalCorsBridgeMiddleware(),\n        });\n        return middlewares;\n      },\n'''
          if marker not in text:
              raise SystemExit("webpack devServer marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Add proxy-agent dependency
        run: |
          pnpm add -D https-proxy-agent@^7.0.6
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.packageManager;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Format and validate
        run: |
          pnpm exec biome check --write --unsafe src/
          pnpm typecheck
          pnpm lint
          rm -rf dist && pnpm build:byok
          rm -rf dist && pnpm build:gateway

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/local-cors-bridge.js src/lib/cors-proxy.ts src/lib/oauth/index.ts src/taskpane/components/chat/model-discovery.ts src/taskpane/components/chat/chat-context.tsx src/taskpane/components/chat/settings-panel.tsx webpack.config.js package.json pnpm-lock.yaml
          git commit -m "Add automatic local CORS bridge for BYOK"
          git push origin HEAD:feature/live-models-gateway-mode
