name: Apply review fixes

on:
  push:
    branches:
      - feature/live-models-gateway-mode
    paths:
      - ".github/apply-review-fixes.py"
      - ".github/workflows/apply-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-models-gateway-mode

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply fixes
        run: python .github/apply-review-fixes.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local bridge smoke test
        run: pnpm test:bridge

      - name: Review regression checks
        run: pnpm test:review-regressions

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate Office manifest
        run: pnpm validate

      - name: Build BYOK mode
        run: pnpm build:byok

      - name: Build Gateway mode
        run: pnpm build:gateway

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json webpack.config.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Fix reviewed runtime and persistence regressions"
          git push origin HEAD:feature/live-models-gateway-mode
