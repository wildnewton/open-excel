name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local bridge smoke test
        run: pnpm test:bridge

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate Office manifest
        run: pnpm validate

      - name: Build BYOK mode
        run: pnpm build:byok

      - name: Build Gateway mode
        run: pnpm build:gateway
