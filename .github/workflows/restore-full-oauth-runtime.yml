name: Restore full BYOK OAuth runtime

on:
  push:
    branches:
      - feature/live-models-gateway-mode

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Restore OAuth token refresh semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/taskpane/components/chat/chat-context.tsx')
          text = path.read_text()

          old = 'import { getWorkbookMetadata, navigateTo } from "../../../lib/excel/api";\n'
          new = old + 'import { loadOAuthCredentials, refreshOAuthToken, saveOAuthCredentials } from "../../../lib/oauth";\n'
          if old not in text:
              raise SystemExit('excel import marker not found')
          text = text.replace(old, new, 1)

          marker = '''  const applyConfig = useCallback(\n    (config: ProviderConfig) => {\n'''
          insert = '''  const configRef = useRef<ProviderConfig | null>(null);\n\n  const getActiveApiKey = useCallback(async (config: ProviderConfig): Promise<string> => {\n    if (config.mode !== "byok" || config.authMethod !== "oauth") {\n      return apiKeyForConfig(config);\n    }\n\n    const creds = loadOAuthCredentials(config.provider);\n    if (!creds) return config.apiKey;\n    if (Date.now() < creds.expires) return creds.access;\n\n    console.log("[Chat] Refreshing OAuth token before API call...");\n    const refreshed = await refreshOAuthToken(config.provider, creds.refresh, config.proxyUrl, config.useProxy);\n    saveOAuthCredentials(config.provider, refreshed);\n    console.log("[Chat] OAuth token refreshed");\n    return refreshed.access;\n  }, []);\n\n''' + marker
          if marker not in text:
              raise SystemExit('applyConfig marker not found')
          text = text.replace(marker, insert, 1)

          old = '''      const proxiedModel = applyProxyToModel(baseModel, config);\n      const existingMessages = agentRef.current?.state.messages ?? [];\n'''
          new = '''      configRef.current = config;\n      const proxiedModel = applyProxyToModel(baseModel, config);\n      const existingMessages = agentRef.current?.state.messages ?? [];\n'''
          if old not in text:
              raise SystemExit('proxied model marker not found')
          text = text.replace(old, new, 1)

          old = '''        streamFn: (model, context, options) => {\n          return streamSimple(model, context, {\n            ...options,\n            apiKey: apiKeyForConfig(config),\n          });\n        },\n'''
          new = '''        streamFn: async (model, context, options) => {\n          const cfg = configRef.current ?? config;\n          const apiKey = await getActiveApiKey(cfg);\n          return streamSimple(model, context, {\n            ...options,\n            apiKey,\n          });\n        },\n'''
          if old not in text:
              raise SystemExit('streamFn marker not found')
          text = text.replace(old, new, 1)

          old = '''    [handleAgentEvent],\n  );\n\n  const setProviderConfig'''
          new = '''    [handleAgentEvent, getActiveApiKey],\n  );\n\n  const setProviderConfig'''
          if old not in text:
              raise SystemExit('dependency marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          oauth_path = Path('src/lib/oauth/index.ts')
          oauth = oauth_path.read_text()
          old_loop = '''  for (const byte of bytes) {\n    binary += String.fromCharCode(byte);\n  }'''
          new_loop = '''  for (let i = 0; i < bytes.length; i++) {\n    binary += String.fromCharCode(bytes[i]);\n  }'''
          if old_loop not in oauth:
              raise SystemExit('OAuth byte loop marker not found')
          oauth_path.write_text(oauth.replace(old_loop, new_loop, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome check --write --unsafe src/

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build BYOK mode
        run: pnpm build:byok

      - name: Build Gateway mode
        run: pnpm build:gateway

      - name: Commit runtime restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/taskpane/components/chat/chat-context.tsx src/taskpane/components/chat/settings-panel.tsx src/taskpane/components/chat/config.ts src/lib/oauth/index.ts
          git commit -m "Restore full upstream BYOK OAuth flow"
          git push origin HEAD:feature/live-models-gateway-mode
